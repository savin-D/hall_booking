<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Hall</title>
    <style>
        /* Global styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(26, 25, 25);
            color: rgb(255, 255, 255);
            font-family: Arial, sans-serif;
        }

        .main {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contain {
            width: 90%;
            max-width: 500px;
            background-color: rgb(40, 40, 40);
            border: 2px solid rgb(255, 255, 255);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.3s ease;
        }

        .contain:hover {
            box-shadow: 0px 10px 30px rgba(226, 75, 64, 0.8), 0px -10px 30px rgba(218, 169, 34, 0.8);
        }

        .title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .t1 {
            border-radius: 25px;
            border: none;
            height: 40px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            border: 1px solid rgb(46, 40, 40);
            font-size: 1rem;
            padding: 5px 10px;
            transition: height 0.3s ease, box-shadow 0.3s ease;
        }

        .t1:hover {
            height: 45px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
        }

        .rad {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 300px;
        }

        .rad label {
            font-size: 1rem;
        }

        button {
            height: 50px;
            width: 150px;
            border-radius: 25px;
            border: 1px solid rgb(46, 40, 40);
            background-color: rgb(83, 144, 202);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            background-image: linear-gradient(rgb(52, 166, 241), rgb(130, 212, 245));
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Media queries for responsiveness */
        @media (max-width: 768px) {
            .contain {
                width: 100%;
                padding: 20px;
                gap: 15px;
            }

            .title {
                font-size: 1.5rem;
            }

            button {
                width: 120px;
                font-size: 0.9rem;
            }

            .rad {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.2rem;
            }

            .t1 {
                width: 100%;
                max-width: 100%;
            }

            .rad {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            button {
                width: 100px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="contain">
            <div class="top">
                <p class="title">SDM Degree College Hall Booking</p>
            </div>
            <div>
                <input type="text" placeholder="Enter your name" class="t1">
            </div>
            <div>
                <input type="text" placeholder="Enter program name" class="t1">
            </div>
            <div>
                <input type="text" placeholder="Enter your department" class="t1">
            </div>  
            <div>
                <input type="date" class="t1">
            </div> 
            <div class="rad">
                <div>
                    <input type="radio" id="morning" name="drone" value="morning" checked>
                    <label for="morning">Morning</label>
                </div>
                <div>
                    <input type="radio" id="evening" name="drone" value="evening">
                    <label for="evening">Evening</label>
                </div>
                <div>
                    <input type="radio" id="full-day" name="drone" value="full-day">
                    <label for="full-day">Full Day</label>
                </div>
            </div>
            <div>
                <button>Submit</button>
            </div>
        </div>
    </div>
</body>
</html>
